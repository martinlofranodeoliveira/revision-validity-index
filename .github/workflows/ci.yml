name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.10.2-jdk21
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare paths inside the job container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/gradle-home" "$GITHUB_WORKSPACE/build/java-home" "$GITHUB_WORKSPACE/build/tmp"
          printf 'GRADLE_USER_HOME=%s/build/gradle-home\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'JAVA_TOOL_OPTIONS=-Duser.home=%s/build/java-home -Djava.io.tmpdir=%s/build/tmp -Dfile.encoding=UTF-8\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Resolve from a cold Gradle home with committed integrity records
        run: gradle --dependency-verification strict resolveDependencies testClasses
      - name: Offline test gate
        run: gradle --offline --dependency-verification strict test
      - name: Separate offline demo gate
        run: gradle --offline --dependency-verification strict --quiet demoAssert
